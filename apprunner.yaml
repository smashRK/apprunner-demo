version: 1.0
runtime: corretto17
build:
  commands:
    build:
      - mvn clean package -DskipTests
run:
  command: java -jar target/UserManagement-0.0.1-SNAPSHOT.jar
  network:
    port: 8080
    healthCheck:
      path: /actuator/health
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: prod
    - name: SERVER_PORT
      value: "8080"
instance:
  instanceRole: apprunner-service-role
  cpu: 1
  memory: 2048
  autoscaling:
    minSize: 1
    maxSize: 2
    maxConcurrency: 100
